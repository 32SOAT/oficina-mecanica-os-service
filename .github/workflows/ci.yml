name: ci

on:
  pull_request:
  push:
    branches: [main, homolog]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run build
