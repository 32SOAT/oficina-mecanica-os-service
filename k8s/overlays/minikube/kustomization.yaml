apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina-mecanica
resources:
  - namespace.yaml
  - postgres.yaml
  - os-service.yaml
  - migration-job.yaml
configMapGenerator:
  - name: os-postgres-config
    literals:
      - POSTGRES_DB=oficina_os
      - POSTGRES_USER=oficina
  - name: os-service-config
    literals:
      - NODE_ENV=production
      - APP_PORT=3000
      - POSTGRES_HOST=os-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=oficina_os
      - POSTGRES_SYNC=0
      - POSTGRES_SSL=0
      - POSTGRES_SSL_REJECT_UNAUTHORIZED=0
      - JWT_EXPIRES_IN=1h
      - RESEND_FROM=onboarding@resend.dev
      - NOTIFICACAO_EMAIL_MECANICOS=local@example.com
      - NOTIFICACAO_EMAIL_ADMIN=local@example.com
      - BILLING_BASE_URL=http://oficina-mecanica-billing-service:3000
      - EXECUCAO_BASE_URL=http://oficina-mecanica-execucao-service:3000
      - BUSINESS_METRICS_ENABLED=true
secretGenerator:
  - name: os-postgres-secret
    literals:
      - POSTGRES_PASSWORD=oficina-local
  - name: os-service-secret
    literals:
      - POSTGRES_USER=oficina
      - POSTGRES_PASSWORD=oficina-local
      - JWT_SECRET=jwt-secret-apenas-para-desenvolvimento-local
      - RESEND_API_KEY=re_chave-ficticia-para-desenvolvimento-local
      - SAGA_TOKEN=oficina-local
generatorOptions:
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
