apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oficina-os-postgres-only
spec:
  podSelector:
    matchLabels:
      app: oficina-os-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oficina-os
      ports:
        - protocol: TCP
          port: 5432
