apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oficina-os-postgres
spec:
  serviceName: oficina-os-postgres
  replicas: 1
  selector:
    matchLabels:
      app: oficina-os-postgres
  template:
    metadata:
      labels:
        app: oficina-os-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: oficina_os
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oficina-os-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-os-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
