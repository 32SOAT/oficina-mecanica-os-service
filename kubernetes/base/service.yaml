apiVersion: v1
kind: Service
metadata:
  name: oficina-os
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: oficina-os
  ports:
    - name: http
      port: 80
      targetPort: http
